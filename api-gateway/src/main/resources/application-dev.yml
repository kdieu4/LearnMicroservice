spring:
  config:
    activate:
      on-profile: dev
  devtools:
    add-properties: true
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:5173"
                allowedHeaders: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
          routes: # Điều hướng reqyest đến service tương ứng thông qua địa chỉ trên url
            - id: authentication-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**
              filters:
                - RewritePath=/auth/(?<segment>.*), /$\{segment} # thay the ky tự /auth/ thành /
                - CustomizeFilter
            - id: account-service
              uri: http://localhost:8082
              predicates:
                - Path=/account/**
              filters:
                - RewritePath=/account/(?<segment>.*), /$\{segment} # che dau url thuc
            - id: authentication-docs
              uri: http://localhost:8081
              predicates:
                - Path=/v3/api-docs/authentication-service
              filters:
                - SetPath=/v3/api-docs
            - id: account-docs
              uri: http://localhost:8082
              predicates:
                - Path=/v3/api-docs/account-service
              filters:
                - SetPath=/v3/api-docs

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - url: /v3/api-docs
        name: API Gateway
      - url: /v3/api-docs/authentication-service
        name: Authentication Service
      - url: /v3/api-docs/account-service
        name: Account Service